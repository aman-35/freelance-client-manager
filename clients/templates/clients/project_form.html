{% extends 'clients/base.html' %}
{% block content %}
<h2 class="mb-4">Add Project for {{ client.name }}</h2>
<form method="post">
    {% csrf_token %}
    {% for field in form %}
      <div class="mb-3">
        <label class="form-label">{{ field.label }}</label>
        {{ field }}
      </div>
    {% endfor %}
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{% url 'project_list' client.id %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
