<!DOCTYPE html>
<html>
<head>
    <title>Freelance Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'client_list' %}">Freelance Manager</a>
        {% if user.is_authenticated %}
            <span class="text-white me-3">Hi, {{ user.username }}</span>
            <a class="btn btn-outline-light btn-sm" href="{% url 'logout' %}">Log out</a>
        {% else %}
            <a class="btn btn-outline-light btn-sm me-2" href="{% url 'login' %}">Log in</a>
            <a class="btn btn-light btn-sm" href="{% url 'signup' %}">Sign up</a>
        {% endif %}
    </div>
</nav>
<div class="container">
    {% block content %}{% endblock %}
</div>
</body>
</html>
