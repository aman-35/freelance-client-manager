{% extends 'clients/base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h2>My Clients</h2>
  <a href="{% url 'client_create' %}" class="btn btn-primary">+ Add Client</a>
</div>
<div class="row">
  {% for client in clients %}
    <div class="col-md-4 mb-3">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">{{ client.name }}</h5>
          <p class="card-text text-muted">{{ client.email }}</p>
          <a href="{% url 'project_list' client.id %}" class="btn btn-sm btn-outline-primary">View Projects</a>
          <a href="{% url 'client_update' client.id %}" class="btn btn-sm btn-outline-secondary">Edit</a>
          <a href="{% url 'client_delete' client.id %}" class="btn btn-sm btn-outline-danger">Delete</a>
        </div>
      </div>
    </div>
  {% empty %}
    <p>No clients yet. Add your first one.</p>
  {% endfor %}
</div>
{% endblock %}
