{% extends 'clients/base.html' %}
{% block content %}
<h2 class="mb-4">Delete Project</h2>
<div class="alert alert-warning">
    Are you sure you want to delete <strong>{{ project.title }}</strong>? This will also delete all its tasks.
</div>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
    <a href="{% url 'project_list' project.client.id %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
