{% extends 'clients/base.html' %}
{% block content %}
<a href="{% url 'client_list' %}">&laquo; Back to Clients</a>
<div class="d-flex justify-content-between align-items-center my-4">
  <h2>{{ client.name }}'s Projects</h2>
  <a href="{% url 'project_create' client.id %}" class="btn btn-primary">+ Add Project</a>
</div>
<div class="row">
  {% for project in projects %}
    <div class="col-md-4 mb-3">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">{{ project.title }}</h5>
          <p class="card-text">{{ project.description|truncatewords:15 }}</p>
          <a href="{% url 'task_list' project.id %}" class="btn btn-sm btn-outline-primary">View Tasks</a>
        </div>
      </div>
    </div>
  {% empty %}
    <p>No projects yet for this client.</p>
  {% endfor %}
</div>
{% endblock %}
